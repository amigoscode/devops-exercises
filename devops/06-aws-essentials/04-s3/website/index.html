<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hosted on S3</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 34rem; padding: 2rem; }
    h1   { font-size: 2.2rem; margin: 0 0 .5rem; }
    span { color: #a78bfa; }
    code { background: #1e293b; padding: .1rem .35rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from <span>S3</span> 👋</h1>
    <p>This page is a file in an S3 bucket, served straight to your browser.
       No server, nothing to patch, and it costs a fraction of a cent.</p>
    <p>Built in the Amigoscode <strong>AWS Essentials</strong> course. Try
       <code>/nope</code> on the end of the address to see the error page.</p>
  </main>
</body>
</html>
